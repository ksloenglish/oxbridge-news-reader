name: Build Pages site
description: Install dependencies, build the Vite site, and upload the GitHub Pages artifact.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.1

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build static site
      shell: bash
      run: VITE_BASE_PATH=/${{ github.event.repository.name }}/ pnpm build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist
