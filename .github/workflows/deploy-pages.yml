name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Feed refresh deploys from Fetch RSS feeds in that same run. A snapshot commit
# uses GITHUB_TOKEN, which does not create a push event for this workflow.
# Push and manual dispatch publish code changes. This workflow holds
# github-pages for the whole run. Fetch joins that group only in its build and
# deploy jobs, after articles.json has changed (including a new checkedAt),
# so a fetch that does not rewrite that file does not wait here. Deploys stay
# serialized.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The triggering SHA can be older than main when this run waited on
      # github-pages while Fetch committed a snapshot. Publish the tip of main
      # so that queued code deploy keeps those articles.
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build static site
        uses: ./.github/actions/build-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
