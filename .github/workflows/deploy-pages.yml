name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fetch RSS feeds pushes the snapshot with the default GITHUB_TOKEN.
  # That push does not create a workflow `push` event. workflow_run still
  # runs after the token push. The workflow name must match fetch-feeds.yml.
  # This workflow does not commit, so it cannot start Fetch RSS feeds again.
  workflow_run:
    workflows: ["Fetch RSS feeds"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    permissions:
      contents: read
    steps:
      # head_sha is the commit Fetch started from. The snapshot commit is
      # pushed later, so compare against the tip of main, not head_sha.
      - name: Check out main
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide whether to publish
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FETCH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(git rev-parse HEAD)"
          if [ "$tip" = "$FETCH_HEAD_SHA" ]; then
            echo "Fetch RSS feeds finished without a new commit on main. Skipping Pages deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "main advanced ${FETCH_HEAD_SHA} -> ${tip}. Deploying Pages."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Check out main after Fetch RSS feeds
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: VITE_BASE_PATH=/${{ github.event.repository.name }}/ pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
