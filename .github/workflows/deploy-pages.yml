name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Feed refresh deploys from Fetch RSS feeds in that same run. A snapshot commit
# uses GITHUB_TOKEN, which does not create a push event for this workflow.
# Push and manual dispatch publish code changes. This workflow and Fetch RSS
# feeds share the github-pages concurrency group so those publishes wait.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Build static site
        uses: ./.github/actions/build-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
