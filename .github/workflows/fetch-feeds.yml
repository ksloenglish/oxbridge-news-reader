name: Fetch RSS feeds

on:
  schedule:
    # Hourly at minute 0 UTC. GitHub may start a scheduled run a few minutes late.
    # The name "Fetch RSS feeds" is the workflow_run contract in deploy-pages.yml.
    # A snapshot commit uses GITHUB_TOKEN, which does not start that workflow via push.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install ingest dependencies
        working-directory: scripts
        run: npm ci

      - name: Test ingest parser
        working-directory: scripts
        run: npm test

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit snapshot when content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/articles.json public/data/feeds.json
          if git diff --cached --quiet; then
            echo "No content change in the RSS snapshot."
            exit 0
          fi
          git commit -m "Update RSS article snapshot" -m "Refreshed public/data/articles.json from the approved feeds."
          git push
